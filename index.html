<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#070b12" />
  <meta name="color-scheme" content="dark light" />
  <meta name="application-name" content="Théo Guérin Portfolio" />
  <script>
    // Définit cet état avant l’analyse du corps HTML pour éviter un affichage furtif du contenu statique au démarrage.
    document.documentElement.setAttribute("data-app-loading", "");
    window.setTimeout(function () {
      // Garde le document accessible si le code de l’application ne démarre pas.
      document.documentElement.removeAttribute("data-app-loading");
    }, 8000);
  </script>

  <title>Théo Guérin | Développeur Freelance Full-Stack à Rennes</title>
  <meta
    name="description"
    content="Théo Guérin, développeur freelance Full-Stack à Rennes, conçoit des sites, applications React et API performantes. Découvrez ses projets et services."
  />
  <link rel="alternate" type="text/markdown" href="https://theo-guerin.fr/llms.txt" />
  <link rel="alternate" type="text/markdown" href="https://theo-guerin.fr/llms-en.txt" hreflang="en" />
  <link rel="alternate" type="text/markdown" href="https://theo-guerin.fr/llms-fr.txt" hreflang="fr" />

  <link rel="icon" type="image/x-icon" href="/images/favicon/favicon.ico" />
  <link rel="icon" type="image/svg+xml" href="/images/favicon/icon.svg" />
  <link rel="apple-touch-icon" sizes="180x180" href="/images/favicon/apple-touch-icon.png" />
  <link rel="manifest" href="/images/favicon/site.webmanifest" />
  <link rel="preload" href="/images/cat-mark.svg" as="image" />

  <style>
    html {
      background: #04070d;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 0% 15%, rgba(72, 129, 255, 0.12), transparent 42%),
        radial-gradient(circle at 100% 0%, rgba(88, 196, 255, 0.08), transparent 35%),
        linear-gradient(160deg, #04070d 0%, #080e1a 42%, #101a2e 100%);
      color: #f5f9ff;
      font-family: "Sora", "Montserrat", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    #root {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    html[data-app-loading] #seo-prerender {
      display: none;
    }

    /* Partage le même indicateur avant React et pendant son éventuel chargement. */
    html[data-app-loading] #root::before,
    .startup-loader:not(.loaded)::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: #04070d url("/images/cat-mark.svg") center / 120px 120px no-repeat;
    }

    html[data-app-loading] #root::after,
    .startup-loader:not(.loaded)::after {
      content: "";
      position: fixed;
      top: calc(50% - 64px);
      left: calc(50% - 64px);
      z-index: 10000;
      box-sizing: border-box;
      width: 128px;
      height: 128px;
      border: 2px solid #25354c;
      border-top-color: #9dc6ff;
      border-radius: 50%;
      animation: app-startup-spin 1s linear infinite;
    }

    @keyframes app-startup-spin {
      to { transform: rotate(360deg); }
    }

    @media (prefers-reduced-motion: reduce) {
      html[data-app-loading] #root::after,
      .startup-loader::after { animation: none; }
    }
  </style>

  <link
    rel="preload"
    href="/fonts/sora-latin-400-normal.woff2"
    as="font"
    type="font/woff2"
    crossorigin
  />
  <link
    rel="preload"
    href="/fonts/montserrat-latin-variable-normal.woff2"
    as="font"
    type="font/woff2"
    crossorigin
  />

</head>
<body>
  <noscript>Version simplifiée : les animations et le formulaire interactif nécessitent JavaScript.</noscript>
  <div id="root"></div>
  <script type="module" src="/src/index.tsx"></script>
</body>
</html>
